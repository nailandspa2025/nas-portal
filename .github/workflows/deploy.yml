name: Deploy Application

on:
  repository_dispatch:
    types: [trigger-deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into On-Premises Server & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull docker.io/${{ secrets.REGISTRY_USERNAME }}/nas-reposetory:${{ github.event.client_payload.sha }}
            docker stop nas-portal || true
            docker rm nas-portal || true
            docker run -d --restart=always --name nas-portal -p 80:80 docker.io/${{ secrets.REGISTRY_USERNAME }}/nas-reposetory:${{ github.event.client_payload.sha }}
