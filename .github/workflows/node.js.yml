name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Check if package-lock.json exists
      id: check_lockfile
      run: |
        if [ -f package-lock.json ]; then
          echo "lockfile_exists=true" >> $GITHUB_ENV
        else
          echo "lockfile_exists=false" >> $GITHUB_ENV
        fi

    - name: Install dependencies (fallback nếu thiếu package-lock.json)
      run: |
        if [ "$lockfile_exists" = "true" ]; then
          npm ci
        else
          npm install
        fi

    - name: Build project
      run: npm run build --if-present
