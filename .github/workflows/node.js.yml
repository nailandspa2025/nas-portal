name: ReactJS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Remove existing node_modules and package-lock.json
        run: rm -rf node_modules package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build
      - name: Set IMAGE_NAME env
        run: echo "IMAGE_NAME=sbdgroup-project-82i5hw8s26" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v1
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # - name: Log in to Viettel Container Registry
      #   uses: docker/login-action@v1
      #   with:
      #     registry: cr1.viettelcloud.vn
      #     username: ${{ secrets.VIETTEL_REGISTRY_USERNAME }}
      #     password: ${{ secrets.VIETTEL_REGISTRY_PASSWORD }}

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v2
      #   with:
      #     context: .
      #     file: Dockerfile
      #     push: true
      #     tags: cr1.viettelcloud.vn/sbdgroup-project-82i5hw8s26/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: docker.io/canhlv/nas-reposetory:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into On-Premises Server & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull ${{ secrets.REGISTRY_USERNAME }}/nas-reposetory:${{ github.sha }}
            docker stop nas-portal || true
            docker rm nas-portal || true
            docker run -d --name nas-portal -p 80:80 ${{ secrets.REGISTRY_USERNAME }}/nas-reposetory:${{ github.sha }}
