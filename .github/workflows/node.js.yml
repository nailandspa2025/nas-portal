name: ReactJS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Viettel Container Registry
      uses: docker/login-action@v1
      with:
        registry: cr1.viettelcloud.vn
        username: ${{ secrets.VIETTEL_REGISTRY_USERNAME }}
        password: ${{ secrets.VIETTEL_REGISTRY_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: Dockerfile
        push: true
        tags: cr1.viettelcloud.vn/sbdgroup-project-82i5hw8s26/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Set IMAGE_NAME env
      run: echo "IMAGE_NAME=your-image-name" >> $GITHUB_ENV
