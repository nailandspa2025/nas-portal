worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    server {
        listen 8081 ssl;
        server_name portal.nasshine.com;

        ssl_certificate /etc/nginx/certs/nasshine.com.crt;
        ssl_certificate_key /etc/nginx/certs/nasshine.com.key;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }

        error_page 404 /index.html;
    }
}
